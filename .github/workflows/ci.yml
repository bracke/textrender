name: ci

# Builds textrender and runs its suite on Linux, macOS and Windows.
#
# The matrix earns its place even though this crate has no per-host source. It
# reads font files byte by byte, and the colour-bitmap work made the gap
# concrete: the sbix reader exists for a format only Apple ships, and until this
# ran on macOS nothing had compiled it there except a consumer's build.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      ALIRE_NONINTERACTIVE: "true"
    strategy:
      fail-fast: false
      matrix:
        # An x86_64 macOS image is required: gnat_native=15.2.1 ships no
        # aarch64-darwin binary, so macos-latest (arm64) cannot resolve the pin.
        os: [ubuntu-latest, macos-15-intel, windows-latest]

    steps:
      - name: Check out textrender
        uses: actions/checkout@v7
        with:
          path: textrender

      # tests/alire.toml pins project_tools at ../../project_tools, so it must
      # exist as a sibling checkout or the manifest will not load.
      - name: Check out sibling crates (transitive pin closure)
        uses: bracke/project_tools/.github/actions/checkout-ada-siblings@main
        with:
          root: textrender

      - name: Set up Alire
        # Pin the toolchain the manifests require. setup-alire@v5 defaults to alr
        # 2.1.0, whose index carries gnat_native 15.2.1; v4 pins alr 2.0.2, whose
        # older index cannot resolve it.
        uses: alire-project/setup-alire@v6
        with:
          toolchain: gnat_native=15.2.1 gprbuild

      - name: Raise Alire solver timeout so slow runners get a complete solution
        # Default solver.timeout is 5 s (+10 s grace); a large graph on a slow
        # runner can time out and ship an INCOMPLETE solution, silently dropping
        # transitive crates (then gprbuild fails with "<x>.gpr not found"). Give
        # the solver room to return the complete solution it finds elsewhere.
        shell: bash
        run: alr settings --global --set solver.timeout 600

      - name: Build the library
        shell: bash
        working-directory: textrender
        run: alr --non-interactive build

      - name: Build and run the test suite
        # The suite finds a monospaced font belonging to whichever host it is on
        # (DejaVu, Menlo, Consolas) and asserts up front that it found one, so a
        # runner image that drops its fonts fails as a missing fixture rather
        # than as a parser defect.
        shell: bash
        working-directory: textrender/tests
        run: |
          alr --non-interactive build
          # The binary takes .exe on Windows, and bash will not find it under the
          # Unix name.
          if [ -f ./bin/tests.exe ]; then
            ./bin/tests.exe
          else
            ./bin/tests
          fi
